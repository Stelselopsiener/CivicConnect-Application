<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivicConnect Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F6F7F8; --sheet:#FFFFFF; --ink:#1E2328; --ink2:#4A535C; --line:#B9C0C7; --fill:#E6E9EC; --fill2:#D5DAdf;
  --blue:#1F5FAD; --blueSoft:#E3EDF9; --ok:#2E7D4F; --okSoft:#E2F2E8; --warn:#9A5B00; --warnSoft:#FBEFD9; --bad:#B3261E; --badSoft:#FBE4E2;
  --focus:#1F5FAD;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --paper:#15181B; --sheet:#1D2125; --ink:#E6E9EC; --ink2:#AAB3BC; --line:#4A535C; --fill:#2A3036; --fill2:#353C43;
  --blue:#7FB0EC; --blueSoft:#1C2E45; --ok:#7CCB9A; --okSoft:#17301F; --warn:#E9B25C; --warnSoft:#35280F; --bad:#F2918A; --badSoft:#3A1A18; --focus:#7FB0EC;}}
:root[data-theme="dark"]{ color-scheme:dark; --paper:#15181B; --sheet:#1D2125; --ink:#E6E9EC; --ink2:#AAB3BC; --line:#4A535C; --fill:#2A3036; --fill2:#353C43;
  --blue:#7FB0EC; --blueSoft:#1C2E45; --ok:#7CCB9A; --okSoft:#17301F; --warn:#E9B25C; --warnSoft:#35280F; --bad:#F2918A; --badSoft:#3A1A18; --focus:#7FB0EC;}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:2px 0 0;max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.nav{display:flex;flex-wrap:wrap;gap:12px}
.navgroup{display:flex;flex-direction:column;gap:4px}
.navgroup span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.navgroup div{display:flex;flex-wrap:wrap;gap:4px}
.tab{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:5px 10px;border-radius:4px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--sheet);color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:1fr}}
.viewport{display:flex;justify-content:center;background:repeating-linear-gradient(45deg,transparent 0 10px,color-mix(in srgb,var(--line) 18%,transparent) 10px 11px);border:1px dashed var(--line);border-radius:6px;padding:14px;overflow-x:auto}
.frame{container-type:inline-size;width:100%;max-width:1000px;background:var(--sheet);border:2px solid var(--ink);border-radius:6px;overflow:hidden;position:relative}
.frame.phone{max-width:390px;border-radius:22px;border-width:6px}
.notes{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.notes h2{font-size:15px;margin:0}
.notes .req{font-family:var(--mono);font-size:12px;color:var(--blue)}
.notes ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.notes li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px}
.notes li b{font-weight:600}
.mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--blue);color:var(--sheet);font:500 11px var(--mono);flex:none}
.frame .mk{vertical-align:middle;margin-right:6px;box-shadow:0 0 0 2px var(--sheet);align-self:center;height:20px}
body.nomk .frame .mk{display:none}
.legend{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}

/* ---------- wireframe UI ---------- */
.app{display:flex;flex-direction:column;min-height:560px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);position:relative}
.logo{font-weight:700;letter-spacing:-.01em}
.logo small{font-weight:400;color:var(--ink2);font-size:12px;margin-left:6px}
.topnav{display:flex;gap:14px;margin-left:12px}
.topnav a{color:var(--ink);text-decoration:none;font-size:13px;padding-bottom:2px;border-bottom:2px solid transparent;cursor:pointer}
.topnav a.on{border-color:var(--ink);font-weight:600}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.bell{position:relative;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px}
.bell i{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:8px;padding:0 4px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--fill2)}
.role{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:1px 6px;border-radius:3px;color:var(--ink2)}
.burger{display:none;width:28px;height:22px;border-block:3px solid var(--ink);position:relative;margin-left:auto}
.burger::after{content:"";position:absolute;left:0;right:0;top:6px;border-top:3px solid var(--ink)}
@container (max-width:560px){ .topnav,.topright .who{display:none} .burger{display:block;margin-left:8px} .topright{margin-left:auto}}

.main{padding:18px 20px;display:flex;flex-direction:column;gap:14px;flex:1;position:relative}
.crumb{font-size:12px;color:var(--ink2)}
.crumb a{color:var(--blue);cursor:pointer;text-decoration:underline}
.h{font-size:20px;font-weight:700;margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink2)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@container (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:600;font-size:13px}
.field .hint{font-size:12px;color:var(--ink2)}
.req-star{color:var(--bad)}
.in{border:1.5px solid var(--ink2);background:var(--sheet);border-radius:4px;padding:8px 10px;min-height:38px;color:var(--ink);font:inherit;width:100%}
.in.ph{color:var(--ink2)}
.in.area{min-height:84px}
.in.err{border-color:var(--bad);border-width:2px}
.errmsg{color:var(--bad);font-size:12px;display:flex;gap:5px;align-items:flex-start}
.errmsg::before{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--bad);color:var(--sheet);font-weight:700;font-size:10px;flex:none;margin-top:1px}
.errsum{border:2px solid var(--bad);background:var(--badSoft);border-radius:4px;padding:10px 12px;font-size:13px}
.errsum b{display:block;margin-bottom:4px}
.errsum a{color:var(--bad);text-decoration:underline;cursor:pointer}
.sel{position:relative}
.sel::after{content:"▾";position:absolute;right:10px;top:9px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ink2);border-radius:18px;padding:5px 11px;font-size:13px;background:var(--sheet);cursor:pointer}
.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn{font:inherit;font-weight:600;font-size:13px;border:2px solid var(--ink);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer;min-height:38px}
.btn.pri{background:var(--ink);color:var(--sheet)}
.btn.dang{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 9px;min-height:30px;font-weight:500}
.link{color:var(--blue);text-decoration:underline;cursor:pointer;font-size:13px}
.card{border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--sheet)}
.card h3{font-size:14px;margin:0 0 8px}
.box{background:var(--fill);border-radius:4px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:12px;padding:2px 9px;border:1.5px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-sub{color:var(--ink2)} .p-asg{color:var(--blue)} .p-inp{color:var(--warn)} .p-res{color:var(--ok)} .p-clo{color:var(--ink)} .p-rej{color:var(--bad)}
.p-over{color:var(--bad);background:var(--badSoft)} .p-over::before{border-radius:0;transform:rotate(45deg);width:6px;height:6px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;border-bottom:2px solid var(--ink);padding:7px 8px;white-space:nowrap}
.t th.sort::after{content:" ↕";color:var(--ink2)}
.t th.sorted::after{content:" ↓";color:var(--ink)}
.t td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--fill)}
.t .num{font-family:var(--mono);font-size:12px}
.tbl{overflow-x:auto}
.cards-m{display:none;flex-direction:column;gap:8px}
@container (max-width:560px){ .tbl.collapse{display:none} .cards-m{display:flex} }
.mcard{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.mcard .top2{display:flex;justify-content:space-between;gap:8px;align-items:center}

.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@container (max-width:720px){.split{grid-template-columns:1fr}}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;margin:0}
.dl dt{color:var(--ink2)} .dl dd{margin:0}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink2)}
.timeline li.now::before{background:var(--ink);border-color:var(--ink)}
.timeline .when{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.banner{border-left:5px solid var(--ok);background:var(--okSoft);padding:10px 12px;border-radius:0 4px 4px 0;font-size:13px}
.banner.info{border-color:var(--blue);background:var(--blueSoft)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@container (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink2)}
.stat.alert{border-color:var(--bad)} .stat.alert .n{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:6px;font-size:12px}
.bars .b{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center}
.bars .track{height:12px;background:var(--fill);border-radius:2px;overflow:hidden}
.bars .fillb{height:100%;background:var(--ink2)}
.bars .v{font-variant-numeric:tabular-nums;text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.filters .field{flex:1 1 150px}
.search{flex:2 1 220px}
.center{display:grid;place-items:center;flex:1;padding:30px 16px}
.authcard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.tabs2{display:flex;border-bottom:2px solid var(--line)}
.tabs2 span{padding:8px 14px;font-weight:600;cursor:pointer;margin-bottom:-2px;border-bottom:3px solid transparent}
.tabs2 span.on{border-color:var(--ink)}
.tabs2 .mk{flex:none;width:20px;padding:0;margin:auto 6px auto 0;border:0}
.toast{position:absolute;right:16px;bottom:16px;background:var(--ink);color:var(--sheet);padding:10px 14px;border-radius:4px;font-size:13px;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.foot{font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding:8px 16px}
.transitions{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13px}
.opt .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink2);flex:none}
.opt.on{border-color:var(--ink);border-width:2px} .opt.on .dot{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--sheet)}
.opt.dis{color:var(--ink2);border-style:dashed}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="bar">
    <div>
      <h1>CivicConnect wireframes · M2</h1>
      <p class="sub">Low-fidelity, clickable prototype of the committed scope (S-IN-001 to S-IN-010), aligned to PED v2.0 (REQ IDs, CR-001, CR-002, email confirmation at registration). Rows, buttons and stat tiles link between screens. Blue markers match the notes on the right.</p>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Preview width">
        <button type="button" id="w-desk" aria-pressed="true">Desktop</button>
        <button type="button" id="w-phone" aria-pressed="false">Phone 390px</button>
      </div>
      <div class="seg" role="group" aria-label="Annotation markers">
        <button type="button" id="mk-on" aria-pressed="true">Markers on</button>
        <button type="button" id="mk-off" aria-pressed="false">Off</button>
      </div>
    </div>
  </header>
  <nav class="nav" id="nav" aria-label="Screens"></nav>
  <div class="stage">
    <div class="viewport"><div class="frame" id="frame"></div></div>
    <aside class="notes" id="notes" aria-live="polite"></aside>
  </div>
</div>

<script>
const S = {}; // screens
const topbar = (role, active) => {
  const links = {
    R:[['r-submit','New request'],['r-list','My requests']],
    S:[['s-list','Worklist'],['s-detail','Request workspace']],
    M:[['m-dash','Oversight'],['m-audit','Audit trail'],['s-list','All requests']]
  }[role];
  const who = {R:['Thandi M.','Requester'],S:['Pieter v.d. Merwe','Staff · Maintenance'],M:['L. Nkosi','Management']}[role];
  return `<div class="top"><span class="logo">CivicConnect<small>service requests</small></span>
  <nav class="topnav">${links.map(([id,t])=>`<a data-go="${id}" class="${id===active?'on':''}">${t}</a>`).join('')}</nav>
  <div class="topright"><span class="bell" aria-label="Notifications, 2 unread">◔<i>2</i></span><span class="who">${who[0]}</span><span class="role who">${who[1]}</span><span class="avatar"></span></div>
  <span class="burger" aria-hidden="true"></span></div>`;
};
const pill = s => ({Pending:'p-sub',Accepted:'p-asg','In Progress':'p-inp',Completed:'p-res',Closed:'p-clo',Rejected:'p-rej',Cancelled:'p-sub',Overdue:'p-over'}[s]);
const P = s => `<span class="pill ${pill(s)}">${s}</span>`;
const mk = n => `<span class="mk" aria-hidden="true">${n}</span>`;
const authTop = `<div class="top"><span class="logo">CivicConnect<small>service requests</small></span></div>`;

S['login'] = {group:'Access', name:'Create account', req:'REQ-023 · REQ-030 · REQ-033 · D13',
 html:()=>`<div class="app">${authTop}
 <div class="center"><div class="authcard">
  <div class="tabs2">${mk(1)}<span>Sign in</span><span class="on">Create account</span></div>
  <div class="field"><label>Full name <span class="req-star">*</span></label><div class="in">Thandi Mokoena</div></div>
  <div class="field"><label>Email address <span class="req-star">*</span></label><div class="in">thandi.m@example.org</div><span class="hint">We will send a confirmation link to this address.</span></div>
  <div class="field"><label>${mk(2)}Password <span class="req-star">*</span></label><div class="in">••••••••••••</div><span class="hint">At least 8 characters. <span class="link">Show password</span></span></div>
  <div class="field"><label>Confirm password <span class="req-star">*</span></label><div class="in">••••••••••••</div></div>
  <button class="btn pri" data-go="check">${mk(3)}Create account</button>
  <p class="muted" style="margin:0;font-size:12px">Staff and management accounts are created by the administrator.</p>
 </div></div></div>`,
 notes:[['One page, two tabs','Sign-in and registration share one page, so a requester never hunts for a separate sign-up link (REQ-023).'],
  ['Password with show toggle','Passwords are hashed with bcrypt (REQ-030, ASR-003). The field allows paste and password managers, and the toggle reduces typing errors on phones (WCAG 3.3.8).'],
  ['Account starts unconfirmed','Pressing Create account saves the account and emails a confirmation link. The user cannot sign in until the email is confirmed (D13, CR-004).']]};

S['check'] = {group:'Access', name:'Confirm your email', req:'REQ-023 · REQ-033 · D13',
 html:()=>`<div class="app">${authTop}
 <div class="main"><div class="split">
  <div style="display:flex;flex-direction:column;gap:12px;max-width:420px">
   <h2 class="h">Check your email</h2>
   <div class="banner info">${mk(1)}We sent a confirmation link to <b>thandi.m@example.org</b>. Open it to activate your account. The link works once and expires in 24 hours.</div>
   <div class="row" style="font-size:13px">${mk(2)}<span class="muted">No email after a few minutes? Check your spam folder, or</span><span class="link">send a new confirmation email</span></div>
   <button class="btn" data-go="signin">Go to sign in</button>
  </div>
  <div class="card" style="background:var(--fill)"><h3>${mk(3)}What the email looks like</h3>
   <div class="card"><p style="margin:0 0 6px;font-size:12px" class="muted">From: CivicConnect &lt;no-reply@…&gt; · Subject: Confirm your CivicConnect account</p>
   <p style="margin:0 0 8px;font-size:13px">Hi Thandi, please confirm this is your email address to activate your CivicConnect account.</p>
   <span class="btn pri sm" style="display:inline-block" data-go="signin">Confirm my email</span>
   <p class="muted" style="margin:8px 0 0;font-size:12px">This link expires in 24 hours. If you did not create an account, ignore this email.</p></div></div>
 </div></div></div>`,
 notes:[['Same page for every address','If the address is already registered, the page looks the same and the existing owner gets a warning email instead, so the form cannot reveal who is registered (OWASP).'],
  ['Recovery is one tap','Resend covers the common failures (spam folder, expired link) without a support call. A new link cancels the old one (R14).'],
  ['Plain email, one action','The email says why it was sent, has one button and says what to do if you did not register. The button opens a page that confirms on click, so mail scanners cannot use the link up.']]};

S['signin'] = {group:'Access', name:'Sign in', req:'REQ-029 · REQ-030 · D13',
 html:()=>`<div class="app">${authTop}
 <div class="center"><div class="authcard">
  <div class="tabs2"><span class="on">Sign in</span><span data-go="login">Create account</span></div>
  <div class="errsum" role="alert"><b>${mk(1)}Please confirm your email first</b>We sent a link to thandi.m@example.org when you registered. <a>Send a new confirmation email</a></div>
  <div class="field"><label>Email address</label><div class="in">thandi.m@example.org</div></div>
  <div class="field"><label>Password</label><div class="in">••••••••••••</div><span class="hint"><span class="link">Show password</span></span></div>
  <button class="btn pri" data-go="r-list">Sign in</button>
  <p class="muted" style="margin:0;font-size:12px">${mk(2)}After sign-in you only see the pages your role allows: Requester → My requests, Staff → Worklist, Management → Oversight.</p>
 </div></div></div>`,
 notes:[['Unconfirmed account explained','A correct password on an unconfirmed account gives a clear reason and a resend button (403 EMAIL_NOT_VERIFIED), not a vague error. A wrong password shows a generic "Email or password is incorrect".'],
  ['Role decides the landing page','Menu items a role cannot use are not rendered at all (REQ-029, ASR-002).']]};

S['r-submit'] = {group:'Requester', name:'Submit request', req:'REQ-001 · REQ-002 · REQ-003 · REQ-027 · REQ-031 · REQ-035',
 html:()=>`<div class="app">${topbar('R','r-submit')}<div class="main">
 <div class="crumb"><a data-go="r-list">My requests</a> / New request</div>
 <h2 class="h">Report a problem</h2>
 <div class="errsum" role="alert"><b>${mk(1)}2 fields need attention before you can submit</b><a>Choose a category</a> · <a>End date cannot be before the start date</a></div>
 <div class="field"><label>${mk(2)}What kind of problem is it? <span class="req-star">*</span></label>
  <div class="chips"><span class="chip">Facility fault</span><span class="chip">Equipment damage</span><span class="chip">Security concern</span><span class="chip">IT support</span><span class="chip">Maintenance</span><span class="chip">Lost property</span><span class="chip">Other</span></div>
  <span class="errmsg">Choose the category that fits best. Staff can correct it later.</span></div>
 <div class="field"><label>Short title <span class="req-star">*</span></label><div class="in">Street light out on corner of Oak and 3rd Ave</div><span class="hint">48 / 80 characters</span></div>

const order=['login','check','signin','r-submit','r-list','r-detail','s-list','s-detail','m-dash','m-audit'];
let cur='r-submit';
const nav=document.getElementById('nav'), frame=document.getElementById('frame'), notes=document.getElementById('notes');
function buildNav(){
  const groups={}; order.forEach(id=>{(groups[S[id].group]??=[]).push(id)});
  nav.innerHTML=Object.entries(groups).map(([g,ids])=>`<div class="navgroup"><span>${g}</span><div>${ids.map(id=>`<button type="button" class="tab" data-go="${id}" aria-pressed="${id===cur}">${S[id].name}</button>`).join('')}</div></div>`).join('');
}
function go(id){ if(!S[id]) return; cur=id; const s=S[id];
  frame.innerHTML=s.html();
  notes.innerHTML=`<h2>${s.name}</h2><div class="req">${s.req}</div><ol>${s.notes.map((n,i)=>`<li><span class="mk">${i+1}</span><span><b>${n[0]}.</b> ${n[1]}</span></li>`).join('')}</ol><p class="legend">Markers are placed near the element each note describes. Example data only.</p>`;
  buildNav(); try{history.replaceState(null,'','#'+id)}catch(e){}
}
window.__go=go;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go]'); if(t){e.preventDefault();go(t.dataset.go);return;}
  const q=e.target.closest('[data-toast]'); if(q){const old=frame.querySelector('.toast'); old&&old.remove(); const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=q.dataset.toast; frame.querySelector('.main').appendChild(d); setTimeout(()=>d.remove(),3500);}
  const c=e.target.closest('.chip'); if(c&&!c.dataset.go){c.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');}
});
const setPress=(a,b,on)=>{a.setAttribute('aria-pressed',on);b.setAttribute('aria-pressed',!on)};
const wd=document.getElementById('w-desk'), wp=document.getElementById('w-phone');
wd.onclick=()=>{frame.classList.remove('phone');setPress(wd,wp,true)};
wp.onclick=()=>{frame.classList.add('phone');setPress(wd,wp,false)};
const m1=document.getElementById('mk-on'), m0=document.getElementById('mk-off');
m1.onclick=()=>{document.body.classList.remove('nomk');setPress(m1,m0,true)};
m0.onclick=()=>{document.body.classList.add('nomk');setPress(m1,m0,false)};
window.__phone=on=>{(on?wp:wd).click()};
const h=(location.hash||'').slice(1); go(S[h]?h:'r-submit');
</script>
