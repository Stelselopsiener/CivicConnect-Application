name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Frontend Checks (Lint, Test, Audit)
        run: |
          cd src/frontend
          npm ci
          npm run lint
          npm test --watchAll=false
          npm audit --audit-level=high

      - name: Backend Checks (Lint, Test, Audit)
        run: |
          cd src/backend
          npm ci
          npm run lint
          npm audit --audit-level=high