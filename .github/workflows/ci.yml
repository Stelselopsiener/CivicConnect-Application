name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Frontend Lint & Audit
        run: |
          cd src/frontend
          npm ci
          npm run lint
          npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Backend Lint & Audit
        run: |
          cd src/backend
          # 2. Changed from 'npm ci' to 'npm install' to fix the lockfile crash
          npm install
          npm run lint
          npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Test Suite
        # 3. Added environment variables to pass your secure passwords to the tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          # 4. Added 'cd src/backend' so the runner actually navigates to your backend folder
          cd src/backend
          # 5. Changed to 'npm install' here as well
          npm install
          npm test
